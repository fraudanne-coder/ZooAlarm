<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anlaut-Zoo</title>
<style>
  :root {
    --start-green: #42b82a;
    --park-grass: #63b946;
    --ink: #1e1e1e;
    --panel: #fffdf5;
    --success: #22c55e;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--start-green);
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    color: var(--ink);
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
  }

  .screen.active {
    display: flex;
  }

  /* ================= SCREEN 1: WILLKOMMEN (ZOO ALARM) ================= */
  #welcomeScreen {
    background-color: var(--start-green);
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: clamp(18px, 4vh, 42px);
  }

  .welcome-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 1;
  }

  .welcome-controls {
    position: relative;
    z-index: 5;
    display: flex;
    gap: 20px;
    align-items: center;
    background: rgba(255, 253, 245, 0.94);
    padding: 12px 22px;
    border-radius: 30px;
    border: 3.5px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
  }

  .icon-btn {
    width: 68px;
    height: 68px;
    border-radius: 22px;
    border: 3.5px solid var(--ink);
    background: #ffffff;
    font-size: 2rem;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .icon-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .start-btn {
    height: 68px;
    padding: 0 38px;
    border-radius: 22px;
    border: 3.5px solid var(--ink);
    background: var(--success);
    color: #ffffff;
    font-size: 1.75rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation;
  }

  .start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  /* ================= SCREEN 2: VOGELPERSPEKTIVE-PARK ================= */
  #gameScreen {
    background: radial-gradient(circle at 50% 45%, #74c954 0%, #57ab3c 100%);
    position: relative;
  }

  .zoo-map-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 25;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    pointer-events: none;
  }

  .top-hud > * {
    pointer-events: auto;
  }

  .round-badge {
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: bold;
    font-size: 1.05rem;
    box-shadow: 0 4px 0 var(--ink);
  }

  .home-btn {
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
  }

  /* Drei Gehege-Zonen passend zur Park-Karte */
  .map-zone {
    position: absolute;
    z-index: 6;
    border-radius: 44% 56% 48% 52% / 50% 44% 56% 50%;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  /* Zone 0: Oben links (Braunes Wald-Gehege) */
  .map-zone-0 {
    left: 4.5%;
    top: 8.5%;
    width: 38%;
    height: 43%;
  }

  /* Zone 1: Oben rechts (Gehege mit großer Wasserfläche) */
  .map-zone-1 {
    right: 4.5%;
    top: 8%;
    width: 39%;
    height: 44%;
  }

  /* Zone 2: Unten links/mitte (Braunes Savannen-Gehege mit Wasserstelle) */
  .map-zone-2 {
    left: 8.5%;
    bottom: 3.5%;
    width: 41%;
    height: 36%;
  }

  .map-zone.highlight {
    box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.72);
    transform: scale(1.03);
  }

  .map-zone.full {
    box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.78);
  }

  /* Holz-Wegweiser für den Buchstaben */
  .signpost-btn {
    position: absolute;
    background: #f5deb3;
    border: 3.5px solid var(--ink);
    border-radius: 16px;
    min-width: 66px;
    padding: 3px 15px;
    font-size: clamp(1.85rem, 4vw, 2.65rem);
    font-weight: bold;
    line-height: 1.1;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation;
    z-index: 9;
  }

  .signpost-btn::after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 13px;
    background: #6b4423;
    border: 2px solid var(--ink);
    border-top: none;
    border-radius: 0 0 3px 3px;
  }

  .signpost-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--ink);
  }

  .map-zone-0 .signpost-btn { top: -10px; left: 41%; }
  .map-zone-1 .signpost-btn { top: -8px;  left: 39%; }
  .map-zone-2 .signpost-btn { top: -14px; left: 41%; }

  /* 3 feste Plätze im Gehege */
  .slot {
    position: absolute;
    width: 30%;
    height: 44%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slot-0 { left: 9%;  top: 23%; }
  .slot-1 { right: 9%; top: 21%; }
  .slot-2 { left: 35%; bottom: 7%; }

  /* Laufende Tiere auf dem Parkweg */
  .animal {
    position: fixed;
    width: clamp(82px, 11vw, 114px);
    height: clamp(82px, 11vw, 114px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    z-index: 16;
    transition: transform 0.12s ease-out;
  }

  .animal.dragging {
    cursor: grabbing;
    z-index: 60;
    transform: scale(1.18);
  }

  .animal.snapped {
    position: static;
    cursor: default;
    touch-action: auto;
    z-index: 8;
    width: clamp(64px, 8.6vw, 94px);
    height: clamp(64px, 8.6vw, 94px);
  }

  .animal img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.28));
  }

  .animal-emoji {
    font-size: clamp(3.2rem, 6vw, 4.7rem);
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.25));
  }

  /* Runden-Abschluss Overlay */
  .round-complete-banner {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 30, 30, 0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .round-complete-banner.show {
    display: flex;
  }

  .complete-card {
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 32px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 10px 0 var(--ink);
    max-width: 440px;
    width: 100%;
  }

  .complete-card h2 {
    margin: 0 0 16px;
    font-size: 2.2rem;
  }

  .next-btn {
    background: var(--success);
    color: #fff;
    border: 3.5px solid var(--ink);
    border-radius: 22px;
    padding: 14px 28px;
    font-size: 1.4rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--ink);
  }

  .next-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--ink);
  }
</style>
</head>
<body>

    <div class="top-hud">

<script>
  // ================= TIERE & RUNDEN (ORDNER: assets/<id>.png) =================
  const ROUNDS = [
    {
      title: "Runde 1: L · N · O",
      letters: ["L", "N", "O"],
      animals: [
        { id: "loewe",      name: "Löwe",       letter: "L", emoji: "🦁", imgBase: "assets/loewe",      audioSrc: "audio/loewe.mp3" },
        { id: "lama",       name: "Lama",       letter: "L", emoji: "🦙", imgBase: "assets/lama",       audioSrc: "audio/lama.mp3" },
        { id: "luchs",      name: "Luchs",      letter: "L", emoji: "🐱", imgBase: "assets/luchs",      audioSrc: "audio/luchs.mp3" },
        { id: "nashorn",    name: "Nashorn",    letter: "N", emoji: "🦏", imgBase: "assets/nashorn",    audioSrc: "audio/nashorn.mp3" },
        { id: "nilpferd",   name: "Nilpferd",   letter: "N", emoji: "🦛", imgBase: "assets/nilpferd",   audioSrc: "audio/nilpferd.mp3" },
        { id: "nasenbaer",  name: "Nasenbär",   letter: "N", emoji: "🦝", imgBase: "assets/nasenbaer",  audioSrc: "audio/nasenbaer.mp3" },
        { id: "orang-utan", name: "Orang-Utan", letter: "O", emoji: "🦧", imgBase: "assets/orang-utan", audioSrc: "audio/orang-utan.mp3" },
        { id: "oktopus",    name: "Oktopus",    letter: "O", emoji: "🐙", imgBase: "assets/oktopus",    audioSrc: "audio/oktopus.mp3" },
        { id: "otter",      name: "Otter",      letter: "O", emoji: "🦦", imgBase: "assets/otter",      audioSrc: "audio/otter.mp3" }
      ]
    },
    {
      title: "Runde 2: A · B · F",
      letters: ["A", "B", "F"],
      animals: [
        { id: "ameisenbaer", name: "Ameisenbär", letter: "A", emoji: "🐾", imgBase: "assets/ameisenbaer", audioSrc: "audio/ameisenbaer.mp3" },
        { id: "antilope",    name: "Antilope",   letter: "A", emoji: "🦌", imgBase: "assets/antilope",    audioSrc: "audio/antilope.mp3" },
        { id: "anakonda",    name: "Anakonda",   letter: "A", emoji: "🐍", imgBase: "assets/anakonda",    audioSrc: "audio/anakonda.mp3" },
        { id: "baer",        name: "Bär",        letter: "B", emoji: "🐻", imgBase: "assets/baer",        audioSrc: "audio/baer.mp3" },
        { id: "biber",       name: "Biber",      letter: "B", emoji: "🦫", imgBase: "assets/biber",       audioSrc: "audio/biber.mp3" },
        { id: "bonobo",      name: "Bonobo",     letter: "B", emoji: "🐒", imgBase: "assets/bonobo",      audioSrc: "audio/bonobo.mp3" },
        { id: "flamingo",    name: "Flamingo",   letter: "F", emoji: "🦩", imgBase: "assets/flamingo",    audioSrc: "audio/flamingo.mp3" },
        { id: "frosch",      name: "Frosch",     letter: "F", emoji: "🐸", imgBase: "assets/frosch",      audioSrc: "audio/frosch.mp3" },
        { id: "fuchs",       name: "Fuchs",      letter: "F", emoji: "🦊", imgBase: "assets/fuchs",       audioSrc: "audio/fuchs.mp3" }
      ]
    },
    {
      title: "Runde 3: K · P · T",
      letters: ["K", "P", "T"],
      animals: [
        { id: "krokodil", name: "Krokodil", letter: "K", emoji: "🐊", imgBase: "assets/krokodil", audioSrc: "audio/krokodil.mp3" },
        { id: "koala",    name: "Koala",    letter: "K", emoji: "🐨", imgBase: "assets/koala",    audioSrc: "audio/koala.mp3" },
        { id: "kamel",    name: "Kamel",    letter: "K", emoji: "🐪", imgBase: "assets/kamel",    audioSrc: "audio/kamel.mp3" },
        { id: "pinguin",  name: "Pinguin",  letter: "P", emoji: "🐧", imgBase: "assets/pinguin",  audioSrc: "audio/pinguin.mp3" },
        { id: "panda",    name: "Panda",    letter: "P", emoji: "🐼", imgBase: "assets/panda",    audioSrc: "audio/panda.mp3" },
        { id: "papagei",  name: "Papagei",  letter: "P", emoji: "🦜", imgBase: "assets/papagei",  audioSrc: "audio/papagei.mp3" },
        { id: "tiger",    name: "Tiger",    letter: "T", emoji: "🐯", imgBase: "assets/tiger",    audioSrc: "audio/tiger.mp3" },
        { id: "tapir",    name: "Tapir",    letter: "T", emoji: "🐗", imgBase: "assets/tapir",    audioSrc: "audio/tapir.mp3" },
        { id: "tukan",    name: "Tukan",    letter: "T", emoji: "🐦", imgBase: "assets/tukan",    audioSrc: "audio/tukan.mp3" }
      ]
    }
  ];

  const DECOY_POOL = [
    { id: "zebra",   name: "Zebra",   letter: "Z", emoji: "🦓", imgBase: "assets/zebra",   audioSrc: "audio/zebra.mp3" },
    { id: "elefant", name: "Elefant", letter: "E", emoji: "🐘", imgBase: "assets/elefant", audioSrc: "audio/elefant.mp3" },
    { id: "giraffe", name: "Giraffe", letter: "G", emoji: "🦒", imgBase: "assets/giraffe", audioSrc: "audio/giraffe.mp3" },
    { id: "wal",     name: "Wal",     letter: "W", emoji: "🐳", imgBase: "assets/wal",     audioSrc: "audio/wal.mp3" }
  ];

  const PHONETIC_FALLBACK = {
    "A": "Aaa", "B": "B", "F": "Fff", "K": "K", "L": "Lll",
    "N": "Nnn", "O": "Ooo", "P": "P", "T": "T"
  };

  // ================= AUDIO =================
  let currentAudio = null;

  function playSound({ mp3Path, fallbackText }) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    if (mp3Path) {
      const audio = new Audio(mp3Path);
      currentAudio = audio;
      audio.play().catch(() => {
        speakFallback(fallbackText);
      });
      return;
    }
    speakFallback(fallbackText);
  }

  function speakFallback(text) {
    if (!text || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'de-DE';
    utter.rate = 0.88;
    window.speechSynthesis.speak(utter);
  }

  function playWelcomeAudio() {
    playSound({
      mp3Path: "audio/willkommen.mp3",
      fallbackText: "Zoo Alarm! Leider sind unsere Tiere ausgebrochen. Hilf uns, sie wieder in die richtigen Gehege zu bringen."
    });
  }

  function playLetterAudio(letter) {
    const key = letter.toLowerCase();
    playSound({
      mp3Path: `audio/laut_${key}.mp3`,
      fallbackText: PHONETIC_FALLBACK[letter] || letter
    });
  }

  // ================= WEG-KURVE FÜR DIE TIERE =================
  function getPathY(progressX, screenHeight) {
    const t = Math.max(0, Math.min(1, progressX));
    let normY;
    if (t < 0.5) {
      const u = t * 2;
      normY = (1 - u) * (1 - u) * 0.66 + 2 * (1 - u) * u * 0.56 + u * u * 0.57;
    } else {
      const u = (t - 0.5) * 2;
      normY = (1 - u) * (1 - u) * 0.57 + 2 * (1 - u) * u * 0.72 + u * u * 0.74;
    }
    return normY * screenHeight - 52;
  }

  // ================= SPIELZUSTAND =================
  let roundIndex = 0;
  let activeWalkers = [];
  let placedByLetter = {};
  let spawnTimer = null;
  let rafId = null;
  let lastFrameTime = 0;
  let roundFinished = false;

  const MIN_WALKER_GAP = 145;

  function openWelcomeScreen() {
    stopLoop();
    document.getElementById('roundCompleteBanner').classList.remove('show');
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('welcomeScreen').classList.add('active');
  }

  function openGameScreen() {
    document.getElementById('welcomeScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    initRound(roundIndex);
  }

  function initRound(idx) {
    stopLoop();
    roundFinished = false;
    document.getElementById('roundCompleteBanner').classList.remove('show');

    const round = ROUNDS[idx % ROUNDS.length];
    document.getElementById('roundBadge').textContent = round.title;

    placedByLetter = {};
    round.letters.forEach(l => placedByLetter[l] = new Set());

    const zonesLayer = document.getElementById('mapZonesLayer');
    zonesLayer.innerHTML = '';

    round.letters.forEach((letter, i) => {
      const zone = document.createElement('div');
      zone.className = `map-zone map-zone-${i}`;
      zone.dataset.letter = letter;

      const sign = document.createElement('button');
      sign.type = 'button';
      sign.className = 'signpost-btn';
      sign.textContent = letter;
      sign.onclick = (e) => {
        e.stopPropagation();
        playLetterAudio(letter);
      };
      zone.appendChild(sign);

      for (let s = 0; s < 3; s++) {
        const slot = document.createElement('div');
        slot.className = `slot slot-${s}`;
        slot.dataset.occupied = "false";
        zone.appendChild(slot);
      }

      zonesLayer.appendChild(zone);
    });

    const walkersLayer = document.getElementById('walkersLayer');
    walkersLayer.innerHTML = '';
    activeWalkers = [];

    const initialPool = [...round.animals].sort(() => Math.random() - 0.5).slice(0, 3);
    initialPool.forEach((item, i) => {
      spawnWalker(item, 60 + i * 240);
    });

    spawnTimer = setInterval(() => {
      if (roundFinished) return;
      trySpawnNextAnimal(round);
    }, 1700);

    lastFrameTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function isAnimalAlreadyPlaced(animalId) {
    return Object.values(placedByLetter).some(set => set.has(animalId));
  }

  function isAnimalCurrentlyOnPath(animalId) {
    return activeWalkers.some(w => !w.snapped && w.data.id === animalId);
  }

  function trySpawnNextAnimal(round) {
    const walkingList = activeWalkers.filter(w => !w.snapped && !w.dragging);
    const leftmostX = walkingList.reduce((min, w) => Math.min(min, w.x), Infinity);
    if (leftmostX < 45) return;

    const availableTargets = round.animals.filter(
      a => !isAnimalAlreadyPlaced(a.id) && !isAnimalCurrentlyOnPath(a.id)
    );
    if (availableTargets.length === 0) return;

    const availableDecoys = DECOY_POOL.filter(d => !isAnimalCurrentlyOnPath(d.id));
    const useDecoy = availableDecoys.length > 0 && Math.random() < 0.25;

    const pool = useDecoy ? availableDecoys : availableTargets;
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    spawnWalker(chosen, -110);
  }

  function spawnWalker(data, startX) {
    const walkersLayer = document.getElementById('walkersLayer');
    const el = document.createElement('div');
    el.className = 'animal';

    const startY = getPathY(startX / window.innerWidth, window.innerHeight);
    el.style.left = `${startX}px`;
    el.style.top = `${startY}px`;

    const fallbackSpan = document.createElement('span');
    fallbackSpan.className = 'animal-emoji';
    fallbackSpan.textContent = data.emoji;
    fallbackSpan.style.display = data.imgBase ? 'none' : 'inline';

    if (data.imgBase) {
      const img = document.createElement('img');
      img.src = `${data.imgBase}.png`;
      img.alt = data.name;
      img.onerror = () => {
        if (!img.dataset.triedJpg) {
          img.dataset.triedJpg = "1";
          img.src = `${data.imgBase}.jpg`;
        } else {
          img.style.display = 'none';
          fallbackSpan.style.display = 'inline';
        }
      };
      el.appendChild(img);
    }
    el.appendChild(fallbackSpan);

    walkersLayer.appendChild(el);

    const walker = {
      el,
      data,
      x: startX,
      baseSpeed: 64,
      snapped: false,
      dragging: false
    };

    attachDragHandlers(walker);
    activeWalkers.push(walker);
  }

  function attachDragHandlers(walker) {
    let offsetX = 0;
    let offsetY = 0;

    walker.el.addEventListener('pointerdown', (e) => {
      if (walker.snapped || roundFinished) return;
      e.preventDefault();
      walker.el.setPointerCapture(e.pointerId);
      walker.dragging = true;
      walker.el.classList.add('dragging');

      playSound({
        mp3Path: walker.data.audioSrc,
        fallbackText: walker.data.name
      });

      const rect = walker.el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
    });

    walker.el.addEventListener('pointermove', (e) => {
      if (!walker.dragging) return;
      walker.el.style.left = `${e.clientX - offsetX}px`;
      walker.el.style.top = `${e.clientY - offsetY}px`;
      highlightZoneAt(e.clientX, e.clientY);
    });

    walker.el.addEventListener('pointerup', (e) => {
      if (!walker.dragging) return;
      walker.dragging = false;
      walker.el.classList.remove('dragging');
      clearZoneHighlights();

      const targetZone = findZoneAt(e.clientX, e.clientY);
      if (targetZone) {
        const zoneLetter = targetZone.dataset.letter;
        const alreadyInSet = placedByLetter[zoneLetter]?.has(walker.data.id);
        const freeSlot = targetZone.querySelector('.slot[data-occupied="false"]');

        if (zoneLetter === walker.data.letter && !alreadyInSet && freeSlot) {
          snapIntoSlot(walker, targetZone, freeSlot, zoneLetter);
          return;
        }

        if (zoneLetter === walker.data.letter && (alreadyInSet || !freeSlot)) {
          playSound({
            mp3Path: "audio/voll.mp3",
            fallbackText: alreadyInSet
              ? `${walker.data.name} ist schon im Gehege.`
              : "Dieses Gehege ist schon voll."
          });
        } else {
          playSound({
            mp3Path: "audio/falsch.mp3",
            fallbackText: "Hier wohnt es nicht."
          });
        }
      }

      const dropX = Math.max(20, Math.min(window.innerWidth - 115, e.clientX - offsetX));
      walker.x = findNonOverlappingX(walker, dropX);
      walker.el.style.left = `${walker.x}px`;
      walker.el.style.top = `${getPathY(walker.x / window.innerWidth, window.innerHeight)}px`;
    });
  }

  function findNonOverlappingX(targetWalker, desiredX) {
    let candidateX = desiredX;
    const others = activeWalkers.filter(w => w !== targetWalker && !w.snapped && !w.dragging);
    let adjusted = true;
    let guard = 0;

    while (adjusted && guard < 12) {
      adjusted = false;
      guard++;
      for (const other of others) {
        if (Math.abs(candidateX - other.x) < MIN_WALKER_GAP) {
          candidateX = other.x - MIN_WALKER_GAP;
          adjusted = true;
        }
      }
    }
    return candidateX;
  }

  function snapIntoSlot(walker, zone, slot, letter) {
    walker.snapped = true;
    slot.dataset.occupied = "true";
    placedByLetter[letter].add(walker.data.id);

    if (placedByLetter[letter].size >= 3) {
      zone.classList.add('full');
    }

    walker.el.classList.remove('dragging');
    walker.el.classList.add('snapped');
    walker.el.style.left = '';
    walker.el.style.top = '';
    slot.appendChild(walker.el);

    playSound({
      mp3Path: "audio/richtig.mp3",
      fallbackText: `Super! ${walker.data.name} ist im Gehege.`
    });

    checkRoundComplete();
  }

  function findZoneAt(x, y) {
    const zones = document.querySelectorAll('.map-zone');
    for (const z of zones) {
      const r = z.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        return z;
      }
    }
    return null;
  }

  function highlightZoneAt(x, y) {
    clearZoneHighlights();
    const z = findZoneAt(x, y);
    if (z) z.classList.add('highlight');
  }

  function clearZoneHighlights() {
    document.querySelectorAll('.map-zone.highlight').forEach(el => {
      el.classList.remove('highlight');
    });
  }

  function checkRoundComplete() {
    const allFull = Object.values(placedByLetter).every(set => set.size >= 3);
    if (!allFull) return;

    roundFinished = true;
    clearInterval(spawnTimer);

    activeWalkers.forEach(w => {
      if (!w.snapped && w.el.parentElement) {
        w.el.remove();
      }
    });

    setTimeout(() => {
      playSound({
        mp3Path: "audio/gewonnen.mp3",
        fallbackText: "Hurra! Alle Tiere sind wieder in ihren Gehegen!"
      });
      document.getElementById('roundCompleteBanner').classList.add('show');
    }, 650);
  }

  function nextRound() {
    roundIndex = (roundIndex + 1) % ROUNDS.length;
    initRound(roundIndex);
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    const width = window.innerWidth;
    const height = window.innerHeight;

    const moving = activeWalkers
      .filter(w => !w.snapped && !w.dragging)
      .sort((a, b) => b.x - a.x);

    for (let i = 0; i < moving.length; i++) {
      const w = moving[i];
      let nextX = w.x + w.baseSpeed * dt;

      if (i > 0) {
        const ahead = moving[i - 1];
        const maxAllowedX = ahead.x - MIN_WALKER_GAP;
        if (nextX > maxAllowedX) {
          nextX = maxAllowedX;
        }
      }

      if (nextX > width + 50) {
        const tailX = moving[moving.length - 1]?.x ?? 200;
        nextX = Math.min(-115, tailX - MIN_WALKER_GAP);
      }

      w.x = nextX;
      w.el.style.left = `${w.x}px`;
      w.el.style.top = `${getPathY(w.x / width, height)}px`;
    }

    rafId = requestAnimationFrame(loop);
  }

  function stopLoop() {
    if (spawnTimer) clearInterval(spawnTimer);
    if (rafId) cancelAnimationFrame(rafId);
  }
</script>
</body>
</html>
