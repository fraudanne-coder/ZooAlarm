<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anlaut-Zoo</title>
<style>
  :root {
    --zoo-yellow: #F9C81B;
    --ink: #1e1e1e;
    --panel: #fffdf5;
    --success: #22c55e;
    --btn-blue: #2563eb;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--zoo-yellow);
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    color: var(--ink);
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
  }

  .screen.active {
    display: flex;
  }

  /* ================= SCREEN 1: WILLKOMMEN ================= */
  #welcomeScreen {
    background-color: var(--zoo-yellow);
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: clamp(20px, 5vw, 56px);
  }

  .welcome-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 1;
  }

  .welcome-controls {
    position: relative;
    z-index: 5;
    display: flex;
    gap: 18px;
    align-items: center;
    background: rgba(249, 200, 27, 0.94);
    padding: 14px 20px;
    border-radius: 28px;
    border: 3.5px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
  }

  .icon-btn {
    width: 68px;
    height: 68px;
    border-radius: 22px;
    border: 3.5px solid var(--ink);
    background: #ffffff;
    font-size: 2rem;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .icon-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .start-btn {
    height: 68px;
    padding: 0 34px;
    border-radius: 22px;
    border: 3.5px solid var(--ink);
    background: var(--success);
    color: #ffffff;
    font-size: 1.7rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation;
  }

  .start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  /* ================= SCREEN 2: ZOO-LANDKARTE ================= */
  #gameScreen {
    background-color: var(--zoo-yellow);
    position: relative;
  }

  .game-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    z-index: 0;
  }

  /* Illustrierte Zoo-Karte im Tusche-Stil */
  .zoo-map-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 25;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    pointer-events: none;
  }

  .top-hud > * {
    pointer-events: auto;
  }

  .round-badge {
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: bold;
    font-size: 1.05rem;
    box-shadow: 0 4px 0 var(--ink);
  }

  .home-btn {
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
  }

  /* Drei frei auf der Karte positionierte Gehege-Zonen */
  .map-zone {
    position: absolute;
    z-index: 6;
    border-radius: 46% 54% 48% 52% / 50% 44% 56% 50%;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  /* Zone 0: Oben links (Wald-/Wiesen-Gehege) */
  .map-zone-0 {
    left: 4%;
    top: 10%;
    width: 38%;
    height: 44%;
  }

  /* Zone 1: Oben rechts (Teich-/Felsen-Gehege) */
  .map-zone-1 {
    right: 4%;
    top: 9%;
    width: 39%;
    height: 45%;
  }

  /* Zone 2: Unten links/mitte (Savannen-/Hügel-Gehege) */
  .map-zone-2 {
    left: 8%;
    bottom: 5%;
    width: 40%;
    height: 36%;
  }

  .map-zone.highlight {
    background: rgba(255, 255, 255, 0.45);
    transform: scale(1.03);
  }

  .map-zone.full {
    background: rgba(220, 252, 231, 0.35);
  }

  /* Holz-Wegweiser für den Buchstaben */
  .signpost-btn {
    position: absolute;
    background: #ffffff;
    border: 3.5px solid var(--ink);
    border-radius: 16px;
    min-width: 64px;
    padding: 3px 14px;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: bold;
    line-height: 1.1;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation;
    z-index: 9;
  }

  .signpost-btn::after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 12px;
    background: var(--ink);
    border-radius: 2px;
  }

  .signpost-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--ink);
  }

  .map-zone-0 .signpost-btn { top: -12px; left: 42%; }
  .map-zone-1 .signpost-btn { top: -10px; left: 38%; }
  .map-zone-2 .signpost-btn { top: -16px; left: 42%; }

  /* 3 feste Plätze auf der Wiese jeder Gehege-Insel */
  .slot {
    position: absolute;
    width: 30%;
    height: 44%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slot-0 { left: 10%; top: 24%; }
  .slot-1 { right: 10%; top: 22%; }
  .slot-2 { left: 35%; bottom: 8%; }

  /* Laufende Tiere auf dem Zoo-Weg */
  .animal {
    position: fixed;
    width: clamp(82px, 11vw, 116px);
    height: clamp(82px, 11vw, 116px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    z-index: 16;
    transition: transform 0.12s ease-out;
  }

  .animal.dragging {
    cursor: grabbing;
    z-index: 60;
    transform: scale(1.18);
  }

  .animal.snapped {
    position: static;
    cursor: default;
    touch-action: auto;
    z-index: 8;
    width: clamp(64px, 8.5vw, 94px);
    height: clamp(64px, 8.5vw, 94px);
  }

  .animal img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.16));
  }

  .animal-emoji {
    font-size: clamp(3.2rem, 6vw, 4.8rem);
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.16));
  }

  /* Runden-Abschluss Overlay */
  .round-complete-banner {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 30, 30, 0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .round-complete-banner.show {
    display: flex;
  }

  .complete-card {
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 32px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 10px 0 var(--ink);
    max-width: 440px;
    width: 100%;
  }

  .complete-card h2 {
    margin: 0 0 16px;
    font-size: 2.2rem;
  }

  .next-btn {
    background: var(--success);
    color: #fff;
    border: 3.5px solid var(--ink);
    border-radius: 22px;
    padding: 14px 28px;
    font-size: 1.4rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--ink);
  }

  .next-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--ink);
  }
</style>
</head>
<body>

  <!-- SCREEN 1: WILLKOMMEN -->
  <section id="welcomeScreen" class="screen active">
    <img class="welcome-bg-img" src="1.png" alt="Willkommen im Zoo"
         onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='1.PNG';}else{this.style.display='none';}">
    <div class="welcome-controls">
      <button class="icon-btn" id="welcomeAudioBtn" aria-label="Text vorlesen" onclick="playWelcomeAudio()">🔊</button>
      <button class="start-btn" onclick="openGameScreen()">Start</button>
    </div>
  </section>

  <!-- SCREEN 2: ZOO-LANDKARTE -->
  <section id="gameScreen" class="screen">
    <img class="game-bg-img" src="2.png" alt=""
         onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='2.PNG';}else{this.style.display='none';}">

    <!-- Gezeichnete Zoo-Karte (Wege, 3 Gehege-Inseln, Bäume, Teich, Felsen) -->
    <svg class="zoo-map-svg" viewBox="0 0 1000 620" preserveAspectRatio="none">
      <!-- Geschwungener Hauptweg durch den Zoo -->
      <path d="M -30,415 C 190,395 310,335 495,355 C 675,375 795,485 1030,465"
            fill="none" stroke="#fff7d6" stroke-width="88" stroke-linecap="round" />
      <path d="M -30,372 C 190,352 310,292 495,312 C 675,332 795,442 1030,422"
            fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-dasharray="14 9" stroke-linecap="round" />
      <path d="M -30,458 C 190,438 310,378 495,398 C 675,418 795,528 1030,508"
            fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-dasharray="14 9" stroke-linecap="round" />

      <!-- Kleine Nebenwege zu den Gehege-Inseln -->
      <path d="M 225,355 L 225,315 M 695,355 L 695,315 M 310,415 L 310,445"
            stroke="#1e1e1e" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" />

      <!-- INSEL 0 (Oben Links: Wald-/Wiesen-Bereich) -->
      <path d="M 55,175 C 45,95 145,55 245,62 C 350,68 425,112 415,195 C 405,275 320,315 220,312 C 120,308 62,255 55,175 Z"
            fill="#fffdf5" fill-opacity="0.72" stroke="#1e1e1e" stroke-width="4" stroke-linejoin="round" />
      <!-- Deko: Bäumchen & Grasbüschel -->
      <g transform="translate(88,108)" stroke="#1e1e1e" stroke-width="2.6" fill="#fffdf5">
        <line x1="0" y1="14" x2="0" y2="30" />
        <circle cx="0" cy="6" r="13" />
        <circle cx="-9" cy="11" r="9" />
        <circle cx="9" cy="11" r="9" />
      </g>
      <path d="M 355,255 l -4,-10 m 4,10 l 0,-12 m 0,12 l 5,-9" stroke="#1e1e1e" stroke-width="2.4" stroke-linecap="round" />

      <!-- INSEL 1 (Oben Rechts: Teich-/Felsen-Bereich) -->
      <path d="M 575,165 C 570,82 665,50 775,56 C 885,62 962,108 955,192 C 948,274 865,314 760,310 C 655,306 580,248 575,165 Z"
            fill="#fffdf5" fill-opacity="0.72" stroke="#1e1e1e" stroke-width="4" stroke-linejoin="round" />
      <!-- Deko: Kleiner Teich & Stein -->
      <ellipse cx="885" cy="245" rx="34" ry="18" fill="#e0f2fe" stroke="#1e1e1e" stroke-width="2.6" />
      <path d="M 870,245 Q 885,240 900,245" fill="none" stroke="#1e1e1e" stroke-width="1.8" />
      <path d="M 605,112 C 605,96 632,96 635,112 Z" fill="#e2e8f0" stroke="#1e1e1e" stroke-width="2.5" />

      <!-- INSEL 2 (Unten Links/Mitte: Hügel-Bereich) -->
      <path d="M 95,495 C 90,432 185,405 290,410 C 395,415 478,448 472,512 C 466,576 378,602 275,598 C 172,594 100,558 95,495 Z"
            fill="#fffdf5" fill-opacity="0.72" stroke="#1e1e1e" stroke-width="4" stroke-linejoin="round" />
      <!-- Deko: Kleiner Busch & Gras -->
      <path d="M 128,548 C 122,534 142,528 148,538 C 156,528 174,536 168,548 Z"
            fill="#fffdf5" stroke="#1e1e1e" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 422,542 l -4,-10 m 4,10 l 0,-12 m 0,12 l 5,-9" stroke="#1e1e1e" stroke-width="2.4" stroke-linecap="round" />

      <!-- Kleine Zoo-Deko rechts unten (Eingangstor / Schild) -->
      <g transform="translate(650,535)" stroke="#1e1e1e" stroke-width="2.6" fill="#fffdf5">
        <line x1="0" y1="12" x2="0" y2="32" />
        <circle cx="0" cy="4" r="14" />
        <line x1="26" y1="16" x2="26" y2="32" />
        <circle cx="26" cy="9" r="11" />
      </g>
    </svg>

    <div class="top-hud">
      <div class="round-badge" id="roundBadge">Runde 1: L · N · O</div>
      <button class="home-btn" onclick="openWelcomeScreen()">Startseite</button>
    </div>

    <!-- Container für die 3 interaktiven Gehege-Zonen & laufenden Tiere -->
    <div id="mapZonesLayer"></div>
    <div id="walkersLayer"></div>
  </section>

  <!-- RUNDEN-ABSCHLUSS -->
  <div class="round-complete-banner" id="roundCompleteBanner">
    <div class="complete-card">
      <div style="font-size: 3.5rem;">🎉🦁🐢</div>
      <h2>Super gemacht!</h2>
      <button class="next-btn" onclick="nextRound()">Nächste Runde</button>
    </div>
  </div>

<script>
  // ================= TIERE & RUNDEN =================
  const ROUNDS = [
    {
      title: "Runde 1: L · N · O",
      letters: ["L", "N", "O"],
      animals: [
        { id: "loewe",      name: "Löwe",       letter: "L", emoji: "🦁", imgSrc: "assets/tiere/loewe.png",      audioSrc: "audio/loewe.mp3" },
        { id: "lama",       name: "Lama",       letter: "L", emoji: "🦙", imgSrc: "assets/tiere/lama.png",       audioSrc: "audio/lama.mp3" },
        { id: "luchs",      name: "Luchs",      letter: "L", emoji: "🐱", imgSrc: "assets/tiere/luchs.png",      audioSrc: "audio/luchs.mp3" },
        { id: "nashorn",    name: "Nashorn",    letter: "N", emoji: "🦏", imgSrc: "assets/tiere/nashorn.png",    audioSrc: "audio/nashorn.mp3" },
        { id: "nilpferd",   name: "Nilpferd",   letter: "N", emoji: "🦛", imgSrc: "assets/tiere/nilpferd.png",   audioSrc: "audio/nilpferd.mp3" },
        { id: "nasenbaer",  name: "Nasenbär",   letter: "N", emoji: "🦝", imgSrc: "assets/tiere/nasenbaer.png",  audioSrc: "audio/nasenbaer.mp3" },
        { id: "orang-utan", name: "Orang-Utan", letter: "O", emoji: "🦧", imgSrc: "assets/tiere/orang-utan.png", audioSrc: "audio/orang-utan.mp3" },
        { id: "oktopus",    name: "Oktopus",    letter: "O", emoji: "🐙", imgSrc: "assets/tiere/oktopus.png",    audioSrc: "audio/oktopus.mp3" },
        { id: "otter",      name: "Otter",      letter: "O", emoji: "🦦", imgSrc: "assets/tiere/otter.png",      audioSrc: "audio/otter.mp3" }
      ]
    },
    {
      title: "Runde 2: A · B · F",
      letters: ["A", "B", "F"],
      animals: [
        { id: "ameisenbaer", name: "Ameisenbär", letter: "A", emoji: "🐾", imgSrc: "assets/tiere/ameisenbaer.png", audioSrc: "audio/ameisenbaer.mp3" },
        { id: "antilope",    name: "Antilope",   letter: "A", emoji: "🦌", imgSrc: "assets/tiere/antilope.png",    audioSrc: "audio/antilope.mp3" },
        { id: "anakonda",    name: "Anakonda",   letter: "A", emoji: "🐍", imgSrc: "assets/tiere/anakonda.png",    audioSrc: "audio/anakonda.mp3" },
        { id: "baer",        name: "Bär",        letter: "B", emoji: "🐻", imgSrc: "assets/tiere/baer.png",        audioSrc: "audio/baer.mp3" },
        { id: "biber",       name: "Biber",      letter: "B", emoji: "🦫", imgSrc: "assets/tiere/biber.png",       audioSrc: "audio/biber.mp3" },
        { id: "bonobo",      name: "Bonobo",     letter: "B", emoji: "🐒", imgSrc: "assets/tiere/bonobo.png",      audioSrc: "audio/bonobo.mp3" },
        { id: "flamingo",    name: "Flamingo",   letter: "F", emoji: "🦩", imgSrc: "assets/tiere/flamingo.png",    audioSrc: "audio/flamingo.mp3" },
        { id: "frosch",      name: "Frosch",     letter: "F", emoji: "🐸", imgSrc: "assets/tiere/frosch.png",      audioSrc: "audio/frosch.mp3" },
        { id: "fuchs",       name: "Fuchs",      letter: "F", emoji: "🦊", imgSrc: "assets/tiere/fuchs.png",       audioSrc: "audio/fuchs.mp3" }
      ]
    },
    {
      title: "Runde 3: K · P · T",
      letters: ["K", "P", "T"],
      animals: [
        { id: "krokodil", name: "Krokodil", letter: "K", emoji: "🐊", imgSrc: "assets/tiere/krokodil.png", audioSrc: "audio/krokodil.mp3" },
        { id: "koala",    name: "Koala",    letter: "K", emoji: "🐨", imgSrc: "assets/tiere/koala.png",    audioSrc: "audio/koala.mp3" },
        { id: "kamel",    name: "Kamel",    letter: "K", emoji: "🐪", imgSrc: "assets/tiere/kamel.png",    audioSrc: "audio/kamel.mp3" },
        { id: "pinguin",  name: "Pinguin",  letter: "P", emoji: "🐧", imgSrc: "assets/tiere/pinguin.png",  audioSrc: "audio/pinguin.mp3" },
        { id: "panda",    name: "Panda",    letter: "P", emoji: "🐼", imgSrc: "assets/tiere/panda.png",    audioSrc: "audio/panda.mp3" },
        { id: "papagei",  name: "Papagei",  letter: "P", emoji: "🦜", imgSrc: "assets/tiere/papagei.png",  audioSrc: "audio/papagei.mp3" },
        { id: "tiger",    name: "Tiger",    letter: "T", emoji: "🐯", imgSrc: "assets/tiere/tiger.png",    audioSrc: "audio/tiger.mp3" },
        { id: "tapir",    name: "Tapir",    letter: "T", emoji: "🐗", imgSrc: "assets/tiere/tapir.png",    audioSrc: "audio/tapir.mp3" },
        { id: "tukan",    name: "Tukan",    letter: "T", emoji: "🐦", imgSrc: "assets/tiere/tukan.png",    audioSrc: "audio/tukan.mp3" }
      ]
    }
  ];

  const DECOY_POOL = [
    { id: "zebra",   name: "Zebra",   letter: "Z", emoji: "🦓", imgSrc: "assets/tiere/zebra.png",   audioSrc: "audio/zebra.mp3" },
    { id: "elefant", name: "Elefant", letter: "E", emoji: "🐘", imgSrc: "assets/tiere/elefant.png", audioSrc: "audio/elefant.mp3" },
    { id: "giraffe", name: "Giraffe", letter: "G", emoji: "🦒", imgSrc: "assets/tiere/giraffe.png", audioSrc: "audio/giraffe.mp3" },
    { id: "wal",     name: "Wal",     letter: "W", emoji: "🐳", imgSrc: "assets/tiere/wal.png",     audioSrc: "audio/wal.mp3" }
  ];

  const PHONETIC_FALLBACK = {
    "A": "Aaa", "B": "B", "F": "Fff", "K": "K", "L": "Lll",
    "N": "Nnn", "O": "Ooo", "P": "P", "T": "T"
  };

  // ================= AUDIO =================
  let currentAudio = null;

  function playSound({ mp3Path, fallbackText }) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    if (mp3Path) {
      const audio = new Audio(mp3Path);
      currentAudio = audio;
      audio.play().catch(() => {
        speakFallback(fallbackText);
      });
      return;
    }
    speakFallback(fallbackText);
  }

  function speakFallback(text) {
    if (!text || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'de-DE';
    utter.rate = 0.88;
    window.speechSynthesis.speak(utter);
  }

  function playWelcomeAudio() {
    playSound({
      mp3Path: "audio/willkommen.mp3",
      fallbackText: "Willkommen im Zoo! Leider sind unsere Tiere ausgebrochen. Hilf uns, sie wieder einzufangen."
    });
  }

  function playLetterAudio(letter) {
    const key = letter.toLowerCase();
    playSound({
      mp3Path: `audio/laut_${key}.mp3`,
      fallbackText: PHONETIC_FALLBACK[letter] || letter
    });
  }

  // ================= WEG-KURVE FÜR DIE TIERE =================
  // Berechnet passend zum geschwungenen SVG-Weg die Y-Höhe aus der X-Position (0..1)
  function getPathY(progressX, screenHeight) {
    const t = Math.max(0, Math.min(1, progressX));
    // Kubische Bezier-Kurve passend zum SVG-Pfad (M -30,415 C 190,395 310,335 495,355 C 675,375 795,485 1030,465)
    let normY;
    if (t < 0.5) {
      const u = t * 2;
      normY = (1 - u) * (1 - u) * 0.66 + 2 * (1 - u) * u * 0.56 + u * u * 0.57;
    } else {
      const u = (t - 0.5) * 2;
      normY = (1 - u) * (1 - u) * 0.57 + 2 * (1 - u) * u * 0.72 + u * u * 0.74;
    }
    return normY * screenHeight - 52;
  }

  // ================= SPIELZUSTAND =================
  let roundIndex = 0;
  let activeWalkers = [];
  let placedCounts = {};
  let spawnTimer = null;
  let rafId = null;
  let lastFrameTime = 0;
  let roundFinished = false;

  function openWelcomeScreen() {
    stopLoop();
    document.getElementById('roundCompleteBanner').classList.remove('show');
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('welcomeScreen').classList.add('active');
  }

  function openGameScreen() {
    document.getElementById('welcomeScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    initRound(roundIndex);
  }

  function initRound(idx) {
    stopLoop();
    roundFinished = false;
    document.getElementById('roundCompleteBanner').classList.remove('show');

    const round = ROUNDS[idx % ROUNDS.length];
    document.getElementById('roundBadge').textContent = round.title;

    placedCounts = {};
    round.letters.forEach(l => placedCounts[l] = 0);

    const zonesLayer = document.getElementById('mapZonesLayer');
    zonesLayer.innerHTML = '';

    round.letters.forEach((letter, i) => {
      const zone = document.createElement('div');
      zone.className = `map-zone map-zone-${i}`;
      zone.dataset.letter = letter;

      const sign = document.createElement('button');
      sign.type = 'button';
      sign.className = 'signpost-btn';
      sign.textContent = letter;
      sign.onclick = (e) => {
        e.stopPropagation();
        playLetterAudio(letter);
      };
      zone.appendChild(sign);

      for (let s = 0; s < 3; s++) {
        const slot = document.createElement('div');
        slot.className = `slot slot-${s}`;
        slot.dataset.occupied = "false";
        zone.appendChild(slot);
      }

      zonesLayer.appendChild(zone);
    });

    const walkersLayer = document.getElementById('walkersLayer');
    walkersLayer.innerHTML = '';
    activeWalkers = [];

    const queue = [...round.animals].sort(() => Math.random() - 0.5);
    let queuePointer = 0;

    for (let i = 0; i < 3; i++) {
      const item = queue[queuePointer % queue.length];
      queuePointer++;
      spawnWalker(item, 90 + i * 210);
    }

    spawnTimer = setInterval(() => {
      if (roundFinished) return;
      const remainingTarget = round.animals.filter(a => !isAnimalSnapped(a.id));
      if (remainingTarget.length === 0) return;

      const pickDecoy = Math.random() < 0.25;
      const sourceList = pickDecoy ? DECOY_POOL : remainingTarget;
      const nextAnimal = sourceList[Math.floor(Math.random() * sourceList.length)];
      spawnWalker(nextAnimal, -110);
    }, 2400);

    lastFrameTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function isAnimalSnapped(animalId) {
    return activeWalkers.some(w => w.data.id === animalId && w.snapped);
  }

  function spawnWalker(data, startX) {
    const walkersLayer = document.getElementById('walkersLayer');
    const el = document.createElement('div');
    el.className = 'animal';

    const startY = getPathY(startX / window.innerWidth, window.innerHeight);
    el.style.left = `${startX}px`;
    el.style.top = `${startY}px`;

    const fallbackSpan = document.createElement('span');
    fallbackSpan.className = 'animal-emoji';
    fallbackSpan.textContent = data.emoji;
    fallbackSpan.style.display = data.imgSrc ? 'none' : 'inline';

    if (data.imgSrc) {
      const img = document.createElement('img');
      img.src = data.imgSrc;
      img.alt = data.name;
      img.onerror = () => {
        img.style.display = 'none';
        fallbackSpan.style.display = 'inline';
      };
      el.appendChild(img);
    }
    el.appendChild(fallbackSpan);

    walkersLayer.appendChild(el);

    const walker = {
      el,
      data,
      x: startX,
      speed: 55 + Math.random() * 25,
      snapped: false,
      dragging: false
    };

    attachDragHandlers(walker);
    activeWalkers.push(walker);
  }

  function attachDragHandlers(walker) {
    let offsetX = 0;
    let offsetY = 0;

    walker.el.addEventListener('pointerdown', (e) => {
      if (walker.snapped || roundFinished) return;
      e.preventDefault();
      walker.el.setPointerCapture(e.pointerId);
      walker.dragging = true;
      walker.el.classList.add('dragging');

      playSound({
        mp3Path: walker.data.audioSrc,
        fallbackText: walker.data.name
      });

      const rect = walker.el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
    });

    walker.el.addEventListener('pointermove', (e) => {
      if (!walker.dragging) return;
      walker.el.style.left = `${e.clientX - offsetX}px`;
      walker.el.style.top = `${e.clientY - offsetY}px`;
      highlightZoneAt(e.clientX, e.clientY);
    });

    walker.el.addEventListener('pointerup', (e) => {
      if (!walker.dragging) return;
      walker.dragging = false;
      walker.el.classList.remove('dragging');
      clearZoneHighlights();

      const targetZone = findZoneAt(e.clientX, e.clientY);
      if (targetZone) {
        const zoneLetter = targetZone.dataset.letter;
        const freeSlot = targetZone.querySelector('.slot[data-occupied="false"]');

        if (zoneLetter === walker.data.letter && freeSlot) {
          snapIntoSlot(walker, targetZone, freeSlot, zoneLetter);
          return;
        }

        if (zoneLetter === walker.data.letter && !freeSlot) {
          playSound({
            mp3Path: "audio/voll.mp3",
            fallbackText: "Dieses Gehege ist schon voll."
          });
        } else {
          playSound({
            mp3Path: "audio/falsch.mp3",
            fallbackText: "Hier passt es nicht hin."
          });
        }
      }

      // Zurück auf den Weg
      walker.x = Math.max(20, Math.min(window.innerWidth - 115, e.clientX - offsetX));
      walker.el.style.left = `${walker.x}px`;
      walker.el.style.top = `${getPathY(walker.x / window.innerWidth, window.innerHeight)}px`;
    });
  }

  function snapIntoSlot(walker, zone, slot, letter) {
    walker.snapped = true;
    slot.dataset.occupied = "true";
    placedCounts[letter] = (placedCounts[letter] || 0) + 1;

    if (placedCounts[letter] >= 3) {
      zone.classList.add('full');
    }

    walker.el.classList.remove('dragging');
    walker.el.classList.add('snapped');
    walker.el.style.left = '';
    walker.el.style.top = '';
    slot.appendChild(walker.el);

    playSound({
      mp3Path: "audio/richtig.mp3",
      fallbackText: `Super! ${walker.data.name} ist angekommen.`
    });

    checkRoundComplete();
  }

  function findZoneAt(x, y) {
    const zones = document.querySelectorAll('.map-zone');
    for (const z of zones) {
      const r = z.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        return z;
      }
    }
    return null;
  }

  function highlightZoneAt(x, y) {
    clearZoneHighlights();
    const z = findZoneAt(x, y);
    if (z) z.classList.add('highlight');
  }

  function clearZoneHighlights() {
    document.querySelectorAll('.map-zone.highlight').forEach(el => {
      el.classList.remove('highlight');
    });
  }

  function checkRoundComplete() {
    const allFull = Object.values(placedCounts).every(count => count >= 3);
    if (!allFull) return;

    roundFinished = true;
    clearInterval(spawnTimer);

    activeWalkers.forEach(w => {
      if (!w.snapped && w.el.parentElement) {
        w.el.remove();
      }
    });

    setTimeout(() => {
      playSound({
        mp3Path: "audio/gewonnen.mp3",
        fallbackText: "Hurra! Alle Tiere sind wieder in ihren Gehegen!"
      });
      document.getElementById('roundCompleteBanner').classList.add('show');
    }, 650);
  }

  function nextRound() {
    roundIndex = (roundIndex + 1) % ROUNDS.length;
    initRound(roundIndex);
  }

  function loop(now) {
    const dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    const width = window.innerWidth;
    const height = window.innerHeight;

    activeWalkers.forEach(w => {
      if (w.snapped || w.dragging) return;
      w.x += w.speed * dt;
      if (w.x > width + 40) {
        w.x = -110;
      }
      w.el.style.left = `${w.x}px`;
      w.el.style.top = `${getPathY(w.x / width, height)}px`;
    });

    rafId = requestAnimationFrame(loop);
  }

  function stopLoop() {
    if (spawnTimer) clearInterval(spawnTimer);
    if (rafId) cancelAnimationFrame(rafId);
  }
</script>
</body>
</html>
