<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anlaut-Zoo</title>
<style>
  :root {
    --start-green: #42b82a;
    --ink: #1e1e1e;
    --panel: #fffdf5;
    --success: #22c55e;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--start-green);
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    color: var(--ink);
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
  }

  .screen.active {
    display: flex;
  }

  /* ================= SCREEN 1: WILLKOMMEN ================= */
  #welcomeScreen {
    background-color: var(--start-green);
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: clamp(18px, 4vh, 42px);
  }

  .welcome-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 1;
  }

  .welcome-controls {
    position: relative;
    z-index: 5;
    display: flex;
    gap: 20px;
    align-items: center;
    background: rgba(255, 253, 245, 0.95);
    padding: 12px 22px;
    border-radius: 30px;
    border: 3.5px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
  }

  .icon-btn {
    width: 68px;
    height: 68px;
    border-radius: 22px;
    border: 3.5px solid var(--ink);
    background: #ffffff;
    font-size: 2rem;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .icon-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .start-btn {
    height: 68px;
    padding: 0 38px;
    border-radius: 22px;
    border: 3.5px solid var(--ink);
    background: var(--success);
    color: #ffffff;
    font-size: 1.75rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation;
  }

  .start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  /* ================= SCREEN 2: ZOO-KULISSE (3 GEHEGE OBEN, WEG UNTEN) ================= */
  #gameScreen {
    background: linear-gradient(180deg, #7ed357 0%, #66be43 58%, #57ab38 100%);
    position: relative;
  }

  .zoo-map-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .top-hud {
    position: absolute;
    top: 8px;
    left: 14px;
    right: 14px;
    height: 44px;
    z-index: 25;
    pointer-events: none;
  }

  .top-hud > * {
    pointer-events: auto;
  }

  .round-badge {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 5px 18px;
    font-weight: bold;
    font-size: 1rem;
    white-space: nowrap;
    box-shadow: 0 4px 0 var(--ink);
  }

  .home-btn {
    position: absolute;
    right: 0;
    top: 0;
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 5px 14px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
  }

  /* Drei Gehege-Zonen nebeneinander im oberen Bereich */
  .map-zone {
    position: absolute;
    top: 13%;
    height: 42%;
    width: 29.5%;
    z-index: 6;
    border-radius: 28px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .map-zone-0 { left: 2.5%; }
  .map-zone-1 { left: 35.25%; }
  .map-zone-2 { left: 68%; }

  .map-zone.highlight {
    box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.8);
    transform: scale(1.025);
  }

  .map-zone.full {
    box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.85);
  }

  /* Buchstaben-Wegweiser oben am Gehege */
  .signpost-btn {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: #f6dfaf;
    border: 3.5px solid var(--ink);
    border-radius: 16px;
    min-width: 64px;
    padding: 2px 14px;
    font-size: clamp(1.8rem, 3.8vw, 2.5rem);
    font-weight: bold;
    line-height: 1.1;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation;
    z-index: 9;
  }

  .signpost-btn::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 11px;
    background: #6b4423;
    border: 2px solid var(--ink);
    border-top: none;
    border-radius: 0 0 3px 3px;
  }

  .signpost-btn:active {
    transform: translateX(-50%) translateY(3px);
    box-shadow: 0 2px 0 var(--ink);
  }

  /* 3 feste Plätze innerhalb jedes Geheges */
  .slot {
    position: absolute;
    width: 31%;
    height: 54%;
    bottom: 8%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slot-0 { left: 2%; }
  .slot-1 { left: 34.5%; }
  .slot-2 { left: 67%; }

  /* Laufende Tiere auf dem Weg */
  .animal {
    position: fixed;
    width: clamp(82px, 11vw, 112px);
    height: clamp(82px, 11vw, 112px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    z-index: 16;
    transition: transform 0.12s ease-out;
  }

  .animal.tapped {
    transform: scale(1.1);
  }

  .animal.dragging {
    cursor: grabbing;
    z-index: 60;
    transform: scale(1.18);
  }

  .animal.snapped {
    position: static;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 8;
    width: clamp(62px, 8.2vw, 90px);
    height: clamp(62px, 8.2vw, 90px);
  }

  .animal img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.25));
  }

  .animal-emoji {
    font-size: clamp(3rem, 5.8vw, 4.5rem);
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.22));
  }

  /* Runden-Abschluss */
  .round-complete-banner {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 30, 30, 0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .round-complete-banner.show {
    display: flex;
  }

  .complete-card {
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 32px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 10px 0 var(--ink);
    max-width: 440px;
    width: 100%;
  }

  .complete-card h2 {
    margin: 0 0 16px;
    font-size: 2.2rem;
  }

  .next-btn {
    background: var(--success);
    color: #fff;
    border: 3.5px solid var(--ink);
    border-radius: 22px;
    padding: 14px 28px;
    font-size: 1.4rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--ink);
  }

  .next-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--ink);
  }
</style>
</head>
<body>

  <!-- SCREEN 1: WILLKOMMEN -->
  <section id="welcomeScreen" class="screen active">
    <img class="welcome-bg-img" src="Willkommen im Zoo (3).png" alt="Willkommen im Zoo Alarm"
         onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='1.png';}else{this.style.display='none';}">
    <div class="welcome-controls">
      <button class="icon-btn" id="welcomeAudioBtn" aria-label="Text vorlesen" onclick="playWelcomeAudio()">🔊</button>
      <button class="start-btn" onclick="openGameScreen()">Start</button>
    </div>
  </section>

  <!-- SCREEN 2: VOGELPERSPEKTIVE-ZOO MIT 3 GEHEGEN OBEN & WEG UNTEN -->
  <section id="gameScreen" class="screen">
    <svg class="zoo-map-svg" viewBox="0 0 1000 620" preserveAspectRatio="none">
      <ellipse cx="500" cy="310" rx="490" ry="300" fill="#77cf50" opacity="0.45" />

      <!-- GEHEGE 0 (Links) -->
      <rect x="28" y="82" width="288" height="252" rx="28" fill="#c79557" stroke="#5e3b1b" stroke-width="6" />
      <rect x="38" y="92" width="268" height="232" rx="22" fill="#d7a86c" />
      <path d="M 44,82 L 310,82 M 44,334 L 310,334" stroke="#6b4423" stroke-width="4" stroke-dasharray="14 10" />

      <!-- GEHEGE 1 (Mitte) -->
      <rect x="356" y="82" width="288" height="252" rx="28" fill="#99774d" stroke="#5e3b1b" stroke-width="6" />
      <rect x="366" y="92" width="268" height="232" rx="22" fill="#b49162" />
      <ellipse cx="500" cy="242" rx="105" ry="52" fill="#4cc3f2" stroke="#287da1" stroke-width="3" />
      <path d="M 455,236 Q 500,228 545,236 M 472,258 Q 505,252 536,258"
            fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />

      <!-- GEHEGE 2 (Rechts) -->
      <rect x="684" y="82" width="288" height="252" rx="28" fill="#689e38" stroke="#3c5e1d" stroke-width="6" />
      <rect x="694" y="92" width="268" height="232" rx="22" fill="#84bc4b" />
      <ellipse cx="896" cy="284" rx="44" ry="22" fill="#4cc3f2" stroke="#287da1" stroke-width="2.5" />

      <!-- Nebenwege -->
      <path d="M 172,334 L 172,415" stroke="#e8cf97" stroke-width="26" stroke-linecap="round" />
      <path d="M 500,334 L 500,405" stroke="#e8cf97" stroke-width="26" stroke-linecap="round" />
      <path d="M 828,334 L 828,430" stroke="#e8cf97" stroke-width="26" stroke-linecap="round" />

      <!-- Geschwungener Hauptweg unten -->
      <path d="M -25,425 C 210,395 360,390 525,425 C 690,460 835,445 1025,415"
            fill="none" stroke="#c5a669" stroke-width="88" stroke-linecap="round" />
      <path d="M -25,425 C 210,395 360,390 525,425 C 690,460 835,445 1025,415"
            fill="none" stroke="#f3e1b6" stroke-width="76" stroke-linecap="round" />

      <!-- Bäume aus der Vogelperspektive -->
      <g>
        <circle cx="52" cy="545" r="24" fill="#2d6a22" />
        <circle cx="48" cy="541" r="21" fill="#3f8f2f" />
        <circle cx="240" cy="560" r="21" fill="#2d6a22" />
        <circle cx="236" cy="556" r="18" fill="#49a037" />
        <circle cx="510" cy="565" r="25" fill="#2d6a22" />
        <circle cx="506" cy="561" r="22" fill="#3f8f2f" />
        <circle cx="760" cy="555" r="22" fill="#2d6a22" />
        <circle cx="756" cy="551" r="19" fill="#49a037" />
        <circle cx="945" cy="540" r="26" fill="#2d6a22" />
        <circle cx="941" cy="536" r="23" fill="#3f8f2f" />
      </g>
    </svg>

    <div class="top-hud">
      <div class="round-badge" id="roundBadge">Runde 1: L · N · O</div>
      <button class="home-btn" onclick="openWelcomeScreen()">Startseite</button>
    </div>

    <div id="mapZonesLayer"></div>
    <div id="walkersLayer"></div>
  </section>

  <!-- RUNDEN-ABSCHLUSS -->
  <div class="round-complete-banner" id="roundCompleteBanner">
    <div class="complete-card">
      <div style="font-size: 3.5rem;">🎉🦁🐢</div>
      <h2>Super gemacht!</h2>
      <button class="next-btn" onclick="nextRound()">Nächste Runde</button>
    </div>
  </div>

<script>
  // ================= TIERE & RUNDEN (./<id>.png im Main) =================
  const ROUNDS = [
    {
      title: "Runde 1: L · N · O",
      letters: ["L", "N", "O"],
      animals: [
        { id: "loewe",      name: "Löwe",       letter: "L", emoji: "🦁", imgBase: "./loewe",      audioSrc: "audio/loewe.mp3" },
        { id: "lama",       name: "Lama",       letter: "L", emoji: "🦙", imgBase: "./lama",       audioSrc: "audio/lama.mp3" },
        { id: "luchs",      name: "Luchs",      letter: "L", emoji: "🐱", imgBase: "./luchs",      audioSrc: "audio/luchs.mp3" },
        { id: "nashorn",    name: "Nashorn",    letter: "N", emoji: "🦏", imgBase: "./nashorn",    audioSrc: "audio/nashorn.mp3" },
        { id: "nilpferd",   name: "Nilpferd",   letter: "N", emoji: "🦛", imgBase: "./nilpferd",   audioSrc: "audio/nilpferd.mp3" },
        { id: "nasenbaer",  name: "Nasenbär",   letter: "N", emoji: "🦝", imgBase: "./nasenbaer",  audioSrc: "audio/nasenbaer.mp3" },
        { id: "orang-utan", name: "Orang-Utan", letter: "O", emoji: "🦧", imgBase: "./orang-utan", audioSrc: "audio/orang-utan.mp3" },
        { id: "oktopus",    name: "Oktopus",    letter: "O", emoji: "🐙", imgBase: "./oktopus",    audioSrc: "audio/oktopus.mp3" },
        { id: "otter",      name: "Otter",      letter: "O", emoji: "🦦", imgBase: "./otter",      audioSrc: "audio/otter.mp3" }
      ]
    },
    {
      title: "Runde 2: A · B · F",
      letters: ["A", "B", "F"],
      animals: [
        { id: "ameisenbaer", name: "Ameisenbär", letter: "A", emoji: "🐾", imgBase: "./ameisenbaer", audioSrc: "audio/ameisenbaer.mp3" },
        { id: "antilope",    name: "Antilope",   letter: "A", emoji: "🦌", imgBase: "./antilope",    audioSrc: "audio/antilope.mp3" },
        { id: "anakonda",    name: "Anakonda",   letter: "A", emoji: "🐍", imgBase: "./anakonda",    audioSrc: "audio/anakonda.mp3" },
        { id: "baer",        name: "Bär",        letter: "B", emoji: "🐻", imgBase: "./baer",        audioSrc: "audio/baer.mp3" },
        { id: "biber",       name: "Biber",      letter: "B", emoji: "🦫", imgBase: "./biber",       audioSrc: "audio/biber.mp3" },
        { id: "bonobo",      name: "Bonobo",     letter: "B", emoji: "🐒", imgBase: "./bonobo",      audioSrc: "audio/bonobo.mp3" },
        { id: "flamingo",    name: "Flamingo",   letter: "F", emoji: "🦩", imgBase: "./flamingo",    audioSrc: "audio/flamingo.mp3" },
        { id: "frosch",      name: "Frosch",     letter: "F", emoji: "🐸", imgBase: "./frosch",      audioSrc: "audio/frosch.mp3" },
        { id: "fuchs",       name: "Fuchs",      letter: "F", emoji: "🦊", imgBase: "./fuchs",       audioSrc: "audio/fuchs.mp3" }
      ]
    },
    {
      title: "Runde 3: K · P · T",
      letters: ["K", "P", "T"],
      animals: [
        { id: "krokodil", name: "Krokodil", letter: "K", emoji: "🐊", imgBase: "./krokodil", audioSrc: "audio/krokodil.mp3" },
        { id: "koala",    name: "Koala",    letter: "K", emoji: "🐨", imgBase: "./koala",    audioSrc: "audio/koala.mp3" },
        { id: "kamel",    name: "Kamel",    letter: "K", emoji: "🐪", imgBase: "./kamel",    audioSrc: "audio/kamel.mp3" },
        { id: "pinguin",  name: "Pinguin",  letter: "P", emoji: "🐧", imgBase: "./pinguin",  audioSrc: "audio/pinguin.mp3" },
        { id: "panda",    name: "Panda",    letter: "P", emoji: "🐼", imgBase: "./panda",    audioSrc: "audio/panda.mp3" },
        { id: "papagei",  name: "Papagei",  letter: "P", emoji: "🦜", imgBase: "./papagei",  audioSrc: "audio/papagei.mp3" },
        { id: "tiger",    name: "Tiger",    letter: "T", emoji: "🐯", imgBase: "./tiger",    audioSrc: "audio/tiger.mp3" },
        { id: "tapir",    name: "Tapir",    letter: "T", emoji: "🐗", imgBase: "./tapir",    audioSrc: "audio/tapir.mp3" },
        { id: "tukan",    name: "Tukan",    letter: "T", emoji: "🐦", imgBase: "./tukan",    audioSrc: "audio/tukan.mp3" }
      ]
    }
  ];

  const DECOY_POOL = [
    { id: "zebra",   name: "Zebra",   letter: "Z", emoji: "🦓", imgBase: "./zebra",   audioSrc: "audio/zebra.mp3" },
    { id: "elefant", name: "Elefant", letter: "E", emoji: "🐘", imgBase: "./elefant", audioSrc: "audio/elefant.mp3" },
    { id: "giraffe", name: "Giraffe", letter: "G", emoji: "🦒", imgBase: "./giraffe", audioSrc: "audio/giraffe.mp3" },
    { id: "wal",     name: "Wal",     letter: "W", emoji: "🐳", imgBase: "./wal",     audioSrc: "audio/wal.mp3" }
  ];

  const PHONETIC_FALLBACK = {
    "A": "Aaa", "B": "B", "F": "Fff", "K": "K", "L": "Lll",
    "N": "Nnn", "O": "Ooo", "P": "P", "T": "T"
  };

  // ================= AUDIO =================
  let currentAudio = null;

  function playSound({ mp3Path, fallbackText }) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }

    if (mp3Path) {
      const audio = new Audio(mp3Path);
      currentAudio = audio;
      audio.play().catch(() => {
        speakFallback(fallbackText);
      });
      return;
    }
    speakFallback(fallbackText);
  }

  function speakFallback(text) {
    if (!text || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'de-DE';
    utter.rate = 0.88;
    window.speechSynthesis.speak(utter);
  }

  function playWelcomeAudio() {
    playSound({
      mp3Path: "audio/willkommen.mp3",
      fallbackText: "Zoo Alarm! Leider sind unsere Tiere ausgebrochen. Hilf uns, sie wieder in die richtigen Gehege zu bringen."
    });
  }

  function playLetterAudio(letter) {
    const key = letter.toLowerCase();
    playSound({
      mp3Path: `audio/laut_${key}.mp3`,
      fallbackText: PHONETIC_FALLBACK[letter] || letter
    });
  }

  // ================= WEG-KURVE FÜR DIE TIERE (UNTEN) =================
  function getPathY(progressX, screenHeight) {
    const safeX = Number.isFinite(progressX) ? progressX : 0;
    const safeH = Math.max(240, Number.isFinite(screenHeight) ? screenHeight : window.innerHeight);
    const t = Math.max(0, Math.min(1, safeX));
    let normY;
    if (t < 0.5) {
      const u = t * 2;
      normY = (1 - u) * (1 - u) * 0.68 + 2 * (1 - u) * u * 0.63 + u * u * 0.64;
    } else {
      const u = (t - 0.5) * 2;
      normY = (1 - u) * (1 - u) * 0.64 + 2 * (1 - u) * u * 0.75 + u * u * 0.72;
    }
    return normY * safeH - 52;
  }

  // ================= SPIELZUSTAND =================
  let roundIndex = 0;
  let activeWalkers = [];
  let placedByLetter = {};
  let spawnTimer = null;
  let rafId = null;
  let lastFrameTime = 0;
  let roundFinished = false;
  let currentRoundData = null;

  const MIN_WALKER_GAP = 145;
  const HOLD_TO_DRAG_MS = 220;
  const MOVE_TO_DRAG_PX = 10;

  function openWelcomeScreen() {
    stopLoop();
    document.getElementById('roundCompleteBanner').classList.remove('show');
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('welcomeScreen').classList.add('active');
  }

  function openGameScreen() {
    document.getElementById('welcomeScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    initRound(roundIndex);
  }

  function initRound(idx) {
    stopLoop();
    roundFinished = false;
    document.getElementById('roundCompleteBanner').classList.remove('show');

    const round = ROUNDS[idx % ROUNDS.length];
    currentRoundData = round;
    document.getElementById('roundBadge').textContent = round.title;

    placedByLetter = {};
    round.letters.forEach(l => placedByLetter[l] = new Set());

    const zonesLayer = document.getElementById('mapZonesLayer');
    zonesLayer.innerHTML = '';

    round.letters.forEach((letter, i) => {
      const zone = document.createElement('div');
      zone.className = `map-zone map-zone-${i}`;
      zone.dataset.letter = letter;

      const sign = document.createElement('button');
      sign.type = 'button';
      sign.className = 'signpost-btn';
      sign.textContent = letter;
      sign.onclick = (e) => {
        e.stopPropagation();
        playLetterAudio(letter);
      };
      zone.appendChild(sign);

      for (let s = 0; s < 3; s++) {
        const slot = document.createElement('div');
        slot.className = `slot slot-${s}`;
        slot.dataset.occupied = "false";
        zone.appendChild(slot);
      }

      zonesLayer.appendChild(zone);
    });

    const walkersLayer = document.getElementById('walkersLayer');
    walkersLayer.innerHTML = '';
    activeWalkers = [];

    const initialPool = [...round.animals].sort(() => Math.random() - 0.5).slice(0, 3);
    initialPool.forEach((item, i) => {
      spawnWalker(item, 60 + i * 240);
    });

    spawnTimer = setInterval(() => {
      if (roundFinished) return;
      ensureMinimumWalkers(round);
      trySpawnNextAnimal(round);
    }, 1500);

    lastFrameTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function isAnimalAlreadyPlaced(animalId) {
    return Object.values(placedByLetter).some(set => set.has(animalId));
  }

  function isAnimalCurrentlyOnPath(animalId) {
    return activeWalkers.some(w => !w.snapped && w.data.id === animalId);
  }

  function ensureMinimumWalkers(round) {
    const walkingList = activeWalkers.filter(w => !w.snapped);
    if (walkingList.length >= 3) return;

    const availableTargets = round.animals.filter(
      a => !isAnimalAlreadyPlaced(a.id) && !isAnimalCurrentlyOnPath(a.id)
    );
    const pool = availableTargets.length > 0
      ? availableTargets
      : DECOY_POOL.filter(d => !isAnimalCurrentlyOnPath(d.id));

    if (pool.length === 0) return;
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    const minX = walkingList.reduce((min, w) => Math.min(min, w.x), Infinity);
    const startX = Number.isFinite(minX) ? Math.min(-75, minX - MIN_WALKER_GAP) : 40;
    spawnWalker(chosen, Math.max(-85, startX));
  }

  function trySpawnNextAnimal(round) {
    const walkingList = activeWalkers.filter(w => !w.snapped);
    if (walkingList.length >= 6) return;

    const leftmostX = walkingList.reduce((min, w) => Math.min(min, w.x), Infinity);
    if (walkingList.length > 0 && leftmostX < 35) return;

    const availableTargets = round.animals.filter(
      a => !isAnimalAlreadyPlaced(a.id) && !isAnimalCurrentlyOnPath(a.id)
    );
    if (availableTargets.length === 0) return;

    const availableDecoys = DECOY_POOL.filter(d => !isAnimalCurrentlyOnPath(d.id));
    const useDecoy = availableDecoys.length > 0 && Math.random() < 0.25;

    const pool = useDecoy ? availableDecoys : availableTargets;
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    spawnWalker(chosen, -80);
  }

  function spawnWalker(data, startX) {
    const walkersLayer = document.getElementById('walkersLayer');
    const el = document.createElement('div');
    el.className = 'animal';

    const width = Math.max(320, window.innerWidth);
    const height = Math.max(240, window.innerHeight);
    const clampedX = Math.max(-80, Math.min(width - 90, Number.isFinite(startX) ? startX : -80));
    const startY = getPathY(clampedX / width, height);
    el.style.left = `${clampedX}px`;
    el.style.top = `${startY}px`;

    const fallbackSpan = document.createElement('span');
    fallbackSpan.className = 'animal-emoji';
    fallbackSpan.textContent = data.emoji;
    fallbackSpan.style.display = data.imgBase ? 'none' : 'inline';

    if (data.imgBase) {
      const img = document.createElement('img');
      img.src = `${data.imgBase}.png`;
      img.alt = data.name;
      img.onerror = () => {
        if (!img.dataset.triedJpg) {
          img.dataset.triedJpg = "1";
          img.src = `${data.imgBase}.jpg`;
        } else {
          img.style.display = 'none';
          fallbackSpan.style.display = 'inline';
        }
      };
      el.appendChild(img);
    }
    el.appendChild(fallbackSpan);

    walkersLayer.appendChild(el);

    const walker = {
      el,
      data,
      x: clampedX,
      baseSpeed: 64,
      snapped: false,
      dragging: false
    };

    attachDragHandlers(walker);
    activeWalkers.push(walker);
  }

  function triggerTapFeedback(walker) {
    playSound({
      mp3Path: walker.data.audioSrc,
      fallbackText: walker.data.name
    });
    walker.el.classList.add('tapped');
    setTimeout(() => {
      walker.el.classList.remove('tapped');
    }, 220);
  }

  function attachDragHandlers(walker) {
    let pointerDown = false;
    let activePointerId = null;
    let startClientX = 0;
    let startClientY = 0;
    let offsetX = 0;
    let offsetY = 0;
    let holdTimer = null;

    function clearHoldTimer() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
    }

    function beginDrag(clientX, clientY) {
      if (walker.dragging || walker.snapped || roundFinished) return;
      clearHoldTimer();
      walker.dragging = true;
      walker.el.classList.remove('tapped');
      walker.el.classList.add('dragging');
      walker.el.style.left = `${clientX - offsetX}px`;
      walker.el.style.top = `${clientY - offsetY}px`;
    }

    walker.el.addEventListener('pointerdown', (e) => {
      if (roundFinished) return;
      e.preventDefault();

      if (walker.snapped) {
        triggerTapFeedback(walker);
        return;
      }

      pointerDown = true;
      activePointerId = e.pointerId;
      startClientX = e.clientX;
      startClientY = e.clientY;

      const rect = walker.el.getBoundingClientRect();
      offsetX = Number.isFinite(e.clientX - rect.left) ? e.clientX - rect.left : rect.width / 2;
      offsetY = Number.isFinite(e.clientY - rect.top) ? e.clientY - rect.top : rect.height / 2;

      try {
        walker.el.setPointerCapture(e.pointerId);
      } catch (_) {}

      triggerTapFeedback(walker);

      clearHoldTimer();
      holdTimer = setTimeout(() => {
        if (pointerDown && !walker.dragging) {
          beginDrag(startClientX, startClientY);
        }
      }, HOLD_TO_DRAG_MS);
    });

    walker.el.addEventListener('pointermove', (e) => {
      if (!pointerDown || e.pointerId !== activePointerId || walker.snapped) return;

      const dx = e.clientX - startClientX;
      const dy = e.clientY - startClientY;

      if (!walker.dragging && Math.hypot(dx, dy) >= MOVE_TO_DRAG_PX) {
        beginDrag(e.clientX, e.clientY);
      }

      if (!walker.dragging) return;
      walker.el.style.left = `${e.clientX - offsetX}px`;
      walker.el.style.top = `${e.clientY - offsetY}px`;
      highlightZoneAt(e.clientX, e.clientY);
    });

    function finishPointer(e) {
      if (!pointerDown || e.pointerId !== activePointerId) return;
      pointerDown = false;
      activePointerId = null;
      clearHoldTimer();

      if (!walker.dragging) {
        return;
      }

      walker.dragging = false;
      walker.el.classList.remove('dragging');
      clearZoneHighlights();

      const targetZone = findZoneAt(e.clientX, e.clientY);
      if (targetZone) {
        const zoneLetter = targetZone.dataset.letter;
        const alreadyInSet = placedByLetter[zoneLetter]?.has(walker.data.id);
        const freeSlot = targetZone.querySelector('.slot[data-occupied="false"]');

        if (zoneLetter === walker.data.letter && !alreadyInSet && freeSlot) {
          snapIntoSlot(walker, targetZone, freeSlot, zoneLetter);
          return;
        }

        if (zoneLetter === walker.data.letter && (alreadyInSet || !freeSlot)) {
          playSound({
            mp3Path: "audio/voll.mp3",
            fallbackText: alreadyInSet
              ? `${walker.data.name} ist schon im Gehege.`
              : "Dieses Gehege ist schon voll."
          });
        } else {
          playSound({
            mp3Path: "audio/falsch.mp3",
            fallbackText: "Hier wohnt es nicht."
          });
        }
      }

      const width = Math.max(320, window.innerWidth);
      const height = Math.max(240, window.innerHeight);
      const rawDropX = Number.isFinite(e.clientX - offsetX) ? (e.clientX - offsetX) : 40;
      const dropX = Math.max(20, Math.min(width - 120, rawDropX));
      walker.x = findNonOverlappingX(walker, dropX);
      walker.el.style.left = `${walker.x}px`;
      walker.el.style.top = `${getPathY(walker.x / width, height)}px`;
    }

    walker.el.addEventListener('pointerup', finishPointer);
    walker.el.addEventListener('pointercancel', finishPointer);
  }

  function findNonOverlappingX(targetWalker, desiredX) {
    const width = Math.max(320, window.innerWidth);
    let candidateX = Math.max(16, Math.min(width - 115, Number.isFinite(desiredX) ? desiredX : 40));
    const others = activeWalkers
      .filter(w => w !== targetWalker && !w.snapped && !w.dragging && Number.isFinite(w.x))
      .sort((a, b) => a.x - b.x);

    for (const other of others) {
      if (Math.abs(candidateX - other.x) < MIN_WALKER_GAP) {
        const leftCandidate = other.x - MIN_WALKER_GAP;
        if (leftCandidate >= 14) {
          candidateX = leftCandidate;
        } else {
          candidateX = Math.min(width - 115, other.x + MIN_WALKER_GAP);
        }
      }
    }
    return Math.max(14, Math.min(width - 115, candidateX));
  }

  function snapIntoSlot(walker, zone, slot, letter) {
    walker.snapped = true;
    slot.dataset.occupied = "true";
    placedByLetter[letter].add(walker.data.id);

    if (placedByLetter[letter].size >= 3) {
      zone.classList.add('full');
    }

    walker.el.classList.remove('dragging');
    walker.el.classList.add('snapped');
    walker.el.style.left = '';
    walker.el.style.top = '';
    slot.appendChild(walker.el);

    playSound({
      mp3Path: "audio/richtig.mp3",
      fallbackText: `Super! ${walker.data.name} ist im Gehege.`
    });

    checkRoundComplete();
  }

  function findZoneAt(x, y) {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
    const zones = document.querySelectorAll('.map-zone');
    for (const z of zones) {
      const r = z.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        return z;
      }
    }
    return null;
  }

  function highlightZoneAt(x, y) {
    clearZoneHighlights();
    const z = findZoneAt(x, y);
    if (z) z.classList.add('highlight');
  }

  function clearZoneHighlights() {
    document.querySelectorAll('.map-zone.highlight').forEach(el => {
      el.classList.remove('highlight');
    });
  }

  function checkRoundComplete() {
    const allFull = Object.values(placedByLetter).every(set => set.size >= 3);
    if (!allFull) return;

    roundFinished = true;
    clearInterval(spawnTimer);

    activeWalkers.forEach(w => {
      if (!w.snapped && w.el.parentElement) {
        w.el.remove();
      }
    });

    setTimeout(() => {
      playSound({
        mp3Path: "audio/gewonnen.mp3",
        fallbackText: "Hurra! Alle Tiere sind wieder in ihren Gehegen!"
      });
      document.getElementById('roundCompleteBanner').classList.add('show');
    }, 650);
  }

  function nextRound() {
    roundIndex = (roundIndex + 1) % ROUNDS.length;
    initRound(roundIndex);
  }

  function loop(now) {
    const rawDt = (now - lastFrameTime) / 1000;
    const dt = Number.isFinite(rawDt) && rawDt > 0 ? Math.min(0.05, rawDt) : 0.016;
    lastFrameTime = now;

    const width = Math.max(320, window.innerWidth);
    const height = Math.max(240, window.innerHeight);

    if (!roundFinished && currentRoundData) {
      ensureMinimumWalkers(currentRoundData);
    }

    const moving = activeWalkers
      .filter(w => !w.snapped && !w.dragging)
      .sort((a, b) => b.x - a.x);

    for (let i = 0; i < moving.length; i++) {
      const w = moving[i];
      if (!Number.isFinite(w.x)) w.x = 40;

      let nextX = w.x + w.baseSpeed * dt;

      if (i > 0) {
        const ahead = moving[i - 1];
        if (Number.isFinite(ahead.x)) {
          const maxAllowedX = ahead.x - MIN_WALKER_GAP;
          if (nextX > maxAllowedX) {
            nextX = maxAllowedX;
          }
        }
      }

      if (nextX > width + 20) {
        const leftmostOther = moving.reduce(
          (min, other, idx) => (idx === i || !Number.isFinite(other.x) ? min : Math.min(min, other.x)),
          Infinity
        );
        nextX = Number.isFinite(leftmostOther) && leftmostOther < 40
          ? Math.min(-75, leftmostOther - MIN_WALKER_GAP)
          : -75;
      }

      w.x = Math.max(-80, Math.min(width + 20, nextX));
      w.el.style.left = `${w.x}px`;
      w.el.style.top = `${getPathY(w.x / width, height)}px`;
    }

    rafId = requestAnimationFrame(loop);
  }

  function stopLoop() {
    if (spawnTimer) clearInterval(spawnTimer);
    if (rafId) cancelAnimationFrame(rafId);
  }
</script>
</body>
</html>
